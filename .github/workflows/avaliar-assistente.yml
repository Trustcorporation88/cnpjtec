name: avaliar-assistente

# Roda as 50 perguntas reais na assistente (modelo de verdade) e confere as respostas.
# Precisa do segredo ANTHROPIC_API_KEY no repositório. Roda toda quarta e quando pedido.

on:
  schedule:
    - cron: "41 11 * * 3"
  workflow_dispatch:
    inputs:
      casos:
        description: "Ids separados por vírgula (vazio = todos)"
        required: false

permissions:
  contents: read

jobs:
  avaliar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bateria
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CASOS: ${{ inputs.casos }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::warning::Sem o segredo ANTHROPIC_API_KEY; bateria não rodou."; exit 0; fi
          pnpm --filter @cnpjtec/web avaliar
