name: imagem-web

# Monta a imagem do site a cada push na main e publica no GitHub Container Registry
# (ghcr.io/trustcorporation88/cnpjtec-web). Depois o Railway sobe a etiqueta "latest".

on:
  push:
    branches: [main]
    paths-ignore: ["servicos/**", "supabase/**", "docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imagem-web
  cancel-in-progress: true

jobs:
  imagem:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/trustcorporation88/cnpjtec-web:latest
            ghcr.io/trustcorporation88/cnpjtec-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
